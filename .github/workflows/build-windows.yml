name: Build Windows executable

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build WebP Forge for Windows
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        shell: pwsh
        run: .\build.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist\WebP-Forge.exe")) {
            throw "dist\WebP-Forge.exe was not created."
          }
          Get-Item -LiteralPath "dist\WebP-Forge.exe" |
            Select-Object Name, Length, LastWriteTime

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: WebP-Forge-windows-x64
          path: dist/WebP-Forge.exe
          if-no-files-found: error
          retention-days: 30

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\WebP-Forge.exe").Hash.ToLower() |
            Out-File -FilePath "dist\WebP-Forge.exe.sha256" -Encoding ascii -NoNewline

      - name: Publish automatic GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          $title = "WebP Forge Build ${{ github.run_number }}"
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\WebP-Forge.exe").Hash.ToLower()
          $notes = @"
Automatic Windows x64 build from commit ${{ github.sha }}.

SHA-256: $sha256

Windows may show a SmartScreen reputation warning for unsigned new executables. Download only from this release, verify the checksum above, and scan the file before running it.
"@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "dist\WebP-Forge.exe#WebP-Forge.exe" "dist\WebP-Forge.exe.sha256#WebP-Forge.exe.sha256" --clobber
            gh release edit $tag --title $title --notes $notes --latest
          } else {
            gh release create $tag "dist\WebP-Forge.exe#WebP-Forge.exe" "dist\WebP-Forge.exe.sha256#WebP-Forge.exe.sha256" `
              --target "${{ github.sha }}" `
              --title $title `
              --notes $notes `
              --latest
          }
